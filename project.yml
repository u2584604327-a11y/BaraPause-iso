name: BaraPause
options:
  bundleIdPrefix: de.claua
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
targets:
  BaraPause:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.claua.barapause
        CODE_SIGN_ENTITLEMENTS: Config/BaraPause.entitlements
        INFOPLIST_FILE: Config/BaraPause-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: BaraPauseWidget
        embed: true
      - target: BaraPauseMonitor
        embed: true
      - target: BaraPauseShield
        embed: true
      - target: BaraPauseShare
        embed: true
  BaraPauseShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.claua.barapause.share
        CODE_SIGN_ENTITLEMENTS: Config/Share.entitlements
        INFOPLIST_FILE: Config/Share-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  BaraPauseWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.claua.barapause.widget
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
        INFOPLIST_FILE: Config/Widget-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  BaraPauseMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Monitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.claua.barapause.monitor
        CODE_SIGN_ENTITLEMENTS: Config/Monitor.entitlements
        INFOPLIST_FILE: Config/Monitor-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  BaraPauseShield:
    type: app-extension
    platform: iOS
    sources:
      - path: Shield
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.claua.barapause.shield
        CODE_SIGN_ENTITLEMENTS: Config/Shield.entitlements
        INFOPLIST_FILE: Config/Shield-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  BaraPause:
    build:
      targets:
        BaraPause: all
    run:
      config: Debug
