name: iOS simulator validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode environment
        run: |
          xcodebuild -version
          swift --version
      - name: Install XcodeGen and SVG dependencies
        run: brew install xcodegen cairo
      - name: Generate vector-based icon assets
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install cairosvg
          python3 Scripts/build_icons.py
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build for iOS Simulator (no signing, no IPA)
        run: |
          set -o pipefail
          xcodebuild -project BaraPause.xcodeproj -scheme BaraPause \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BaraPause-iOS-simulator-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
