name: BaraPause iOS — manually validate a source branch

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch to build"
        required: true
        type: choice
        default: feature/ios-v1_2-simulator-package-signing
        options:
          - feature/ios-v1_2-simulator-package-signing
          - feature/ios-v1_1-profiles-continuity
          - feature/ios-v1-swiftui-screen-time

permissions:
  contents: read

jobs:
  simulator:
    name: Generate project and build unsigned simulator app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout selected source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Confirm required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f project.yml
          test -f Scripts/build_icons.py
          test -f Scripts/static_audit.py
          test -f App/BaraPauseApp.swift
          printf 'HEAD='
          git rev-parse HEAD
      - name: Show Xcode environment
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate sharp icon resources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          pip install cairosvg
          python3 Scripts/build_icons.py
          python3 Scripts/static_audit.py
      - name: Generate and inspect project
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project BaraPause.xcodeproj
      - name: Build unsigned iOS Simulator app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project BaraPause.xcodeproj -scheme BaraPause \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BaraPause-iOS-manual-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
